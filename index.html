<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kyle You | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #fafafa;
            color: #1a1a1a;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 24px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #fafafa;
            z-index: 100;
        }

        .logo {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #1a1a1a;
            font-size: 14px;
            font-weight: 400;
            transition: opacity 0.2s ease;
        }

        .nav-links a:hover {
            opacity: 0.5;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 48px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .hero-subtitle {
            font-size: 14px;
            font-weight: 400;
            color: #666;
            margin-bottom: 16px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .hero-title {
            font-size: clamp(48px, 8vw, 96px);
            font-weight: 600;
            line-height: 1.05;
            letter-spacing: -2px;
            margin-bottom: 24px;
        }

        .hero-description {
            font-size: 18px;
            font-weight: 300;
            color: #444;
            max-width: 500px;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .hero-cta {
            display: inline-block;
            padding: 16px 32px;
            background-color: #1a1a1a;
            color: #fafafa;
            text-decoration: none;
            font-size: 14px;
            font-weight: 400;
            transition: background-color 0.2s ease;
        }

        .hero-cta:hover {
            background-color: #333;
        }

        /* Scroll Indicator */
        .scroll-indicator {
            position: absolute;
            bottom: 48px;
            left: 48px;
            font-size: 12px;
            color: #666;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Responsive */
        @media (max-width: 768px) {
            nav {
                padding: 20px 24px;
            }

            .nav-links {
                gap: 20px;
            }

            .hero {
                padding: 0 24px;
            }

            .hero-title {
                letter-spacing: -1px;
            }

            .scroll-indicator {
                left: 24px;
                bottom: 32px;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav>
        <div class="logo">Kyle You</div>
        <ul class="nav-links">
            <li><a href="#work">Work</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <p class="hero-subtitle">Portfolio 2024</p>
        <h1 class="hero-title">Creative<br>Developer</h1>
        <p class="hero-description">
            Building thoughtful digital experiences with clean code and minimal design.
        </p>
        <a href="#work" class="hero-cta">View Projects</a>
    </section>

    <!-- Scroll Indicator -->
    <div class="scroll-indicator">Scroll ↓</div>

</body>
</html>
